<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Aniket Codes</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 40px 30px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .error-code {
            font-size: 80px;
            font-weight: 800;
            color: #58a6ff;
            line-height: 1;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 24px;
            color: #f0f6fc;
            margin-bottom: 12px;
        }

        p {
            font-size: 15px;
            color: #8b949e;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .btn {
            display: inline-block;
            background-color: #238636;
            color: #ffffff;
            text-decoration: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            transition: background-color 0.2s ease;
        }

        .btn:hover {
            background-color: #2ea043;
        }

        .terminal-text {
            font-family: monospace;
            background: #0d1117;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #30363d;
            color: #79c0ff;
            display: inline-block;
            margin-bottom: 20px;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="error-code">404</div>
        <h1>Page Not Found</h1>
        <div class="terminal-text">$ Error: Requested route does not exist</div>
        <p>The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        <a href="https://aniketcodes101.github.io/" class="btn">Return to Homepage</a>
    </div>

</body>
</html>
